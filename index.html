<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Page of Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <input type="checkbox" id="toggle-switch"/>
        <div class="wrapper">
            <label for="toggle-switch"></label>
            <div class="card-container">
                <div class="card">
                    <div class="front">
                        <div class="top">
                            <span>A</span>
                            <span>&clubs;</span>
                        </div>
                        <div class="center">&clubs;</div>
                        <div class="bottom">
                            <span>A</span>
                            <span>&clubs;</span>
                        </div>
                    </div>
                    <div class="back"></div>
                </div>
                <div class="card">
                    <div class="front">
                        <div class="top">
                            <span>H</span>
                            <span>&hearts;</span>
                        </div>
                        <div class="center">&hearts;</div>
                        <div class="bottom">
                            <span>H</span>
                            <span>&hearts;</span>
                        </div>
                    </div>
                    <div class="back"></div>
                </div>
                <div class="card">
                    <div class="front">
                        <div class="top">
                            <span>D</span>
                            <span>♦</span>
                        </div>
                        <div class="center">♦</div>
                        <div class="bottom">
                            <span>D</span>
                            <span>♦</span>
                        </div>
                    </div>
                    <div class="back"></div>
                </div>
                <div class="card">
                    <div class="front">
                        <div class="top">
                            <span>J</span>
                            <span>&spades;</span>
                        </div>
                        <div class="center">&spades;</div>
                        <div class="bottom">
                            <span>J</span>
                            <span>&spades;</span>
                        </div>
                    </div>
                    <div class="back"></div>
                </div>
                <div class="card">
                    <div class="front">
                        <div class="top">
                            <span>C</span>
                            <span>&clubs;</span>
                        </div>
                        <div class="center">&clubs;</div>
                        <div class="bottom">
                            <span>C</span>
                            <span>&clubs;</span>
                        </div>
                    </div>
                    <div class="back"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
